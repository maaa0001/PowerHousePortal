name: Deploy to InfinityFree

on:
  push:
    branches:
      - main  # Or 'master', whichever you use as your default branch

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /htdocs/  # InfinityFree's default web directory
        # exclude: |
        #   **/.git*
        #   **/node_modules/**
        #   README.md
        #   docker-compose.yml
        #   Dockerfile
